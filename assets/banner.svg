<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glow Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="leadPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filter for subtle drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing orbs & particles */
    .pulse-orb {
      animation: pulseAnim 6s ease-in-out infinite alternate;
    }
    .orb-delayed {
      animation: pulseAnim 8s ease-in-out 3s infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: dashMove 20s linear infinite;
    }
    .card-float-1 {
      animation: float1 5s ease-in-out infinite alternate;
    }
    .card-float-2 {
      animation: float2 6s ease-in-out 1s infinite alternate;
    }
    .card-float-3 {
      animation: float3 5.5s ease-in-out 2s infinite alternate;
    }

    @keyframes pulseAnim {
      0% { transform: scale(0.9); opacity: 0.3; }
      100% { transform: scale(1.15); opacity: 0.65; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -160; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
    @keyframes float3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle class="pulse-orb" cx="200" cy="80" r="140" fill="url(#leadPulse)" style="transform-origin: 200px 80px;" />
  <circle class="orb-delayed" cx="1000" cy="280" r="180" fill="url(#leadPulse)" style="transform-origin: 1000px 280px;" />

  <!-- Background Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Animated Lead Flow Streams (Background Layer) -->
  <g stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" fill="none">
    <path class="flow-dash" d="M 50,300 C 250,220 350,330 600,280 C 850,230 950,310 1150,240" />
    <path class="flow-dash" d="M 50,120 C 320,60 480,180 750,110 C 950,50 1080,140 1150,90" stroke="#ec4899" stroke-opacity="0.25" />
  </g>

  <!-- Floating Dynamic Stage Cards (Underneath text & off center to prevent overlap) -->
  <!-- Stage 1: Lead Capture -->
  <g class="card-float-1" transform="translate(80, 240)" filter="url(#cardShadow)">
    <rect width="180" height="58" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="28" cy="29" r="14" fill="#6366f1" fill-opacity="0.2" />
    <text x="28" y="34" font-size="14" fill="#a5b4fc" text-anchor="middle">🎯</text>
    <text x="54" y="26" font-size="12" font-weight="600" fill="#f3f4f6">Lead Capture</text>
    <text x="54" y="44" font-size="11" fill="#9ca3af">Forms • Inbound • Web</text>
  </g>

  <!-- Stage 2: Scoring Engine -->
  <g class="card-float-2" transform="translate(510, 255)" filter="url(#cardShadow)">
    <rect width="180" height="58" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="28" cy="29" r="14" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="28" y="34" font-size="14" fill="#c084fc" text-anchor="middle">⚡</text>
    <text x="54" y="26" font-size="12" font-weight="600" fill="#f3f4f6">Scoring Engine</text>
    <text x="54" y="44" font-size="11" fill="#9ca3af">AI Signals • +85 Score</text>
  </g>

  <!-- Stage 3: Automated Nurture -->
  <g class="card-float-3" transform="translate(940, 240)" filter="url(#cardShadow)">
    <rect width="180" height="58" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="28" cy="29" r="14" fill="#ec4899" fill-opacity="0.2" />
    <text x="28" y="34" font-size="14" fill="#f472b6" text-anchor="middle">🚀</text>
    <text x="54" y="26" font-size="12" font-weight="600" fill="#f3f4f6">Smart Nurture</text>
    <text x="54" y="44" font-size="11" fill="#9ca3af">Omnichannel Journey</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitles -->
  <!-- Category Pill Badge -->
  <g transform="translate(600, 48)">
    <rect x="-140" y="0" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1" />
    <text x="0" y="18" font-size="11" font-weight="700" letter-spacing="1.2" fill="#c7d2fe" text-anchor="middle">SALES TECH &amp; MARKETING AUTOMATION</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="118" font-size="34" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-0.5">
    Awesome Lead Management &amp; Nurturing
  </text>

  <!-- Highlight Gradient Underline / Sub-Bar -->
  <rect x="420" y="132" width="360" height="4" rx="2" fill="url(#primaryGrad)" filter="url(#glowEffect)" />

  <!-- Subtitle -->
  <text x="600" y="168" font-size="16" font-weight="400" text-anchor="middle" fill="#94a3b8">
    Curated Hub of Leading SaaS CRMs &amp; Enterprise Open-Source Growth Engines
  </text>

  <text x="600" y="196" font-size="13" font-weight="500" text-anchor="middle" fill="#cbd5e1" opacity="0.9">
    Lead Scoring • Behavioral Funnels • Automated Journeys • Self-Hosted Pipelines
  </text>
</svg>
